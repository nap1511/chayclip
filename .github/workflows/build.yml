name: Build Windows EXE

# Tu chay moi khi day code len nhanh main, hoac bam chay tay tren GitHub
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Lay code tu repo
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build file exe
        run: pyinstaller --onefile --windowed arduino_control_app.py

      - name: Tai file exe len GitHub (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: arduino_control_app-windows
          path: dist/arduino_control_app.exe
